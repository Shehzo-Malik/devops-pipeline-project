name: Production-Grade CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Code Checkout karein
      uses: actions/checkout@v3

    - name: Python setup karein
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Dependencies install karein
      run: |
        pip install -r requirements.txt

    - name: Trivy Security Scan chalayein
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'table'
        severity: 'CRITICAL,HIGH'

    - name: Docker Image Build karein
      run: docker build -t my-devops-app:${{ github.sha }} .

    - name: AWS Credentials Configure karein
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Amazon ECR par Login karein
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Image ko ECR par Push karein
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: devops-pipeline-project
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker tag my-devops-app:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG